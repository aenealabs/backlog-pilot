[project]
name = "backlog-pilot"
version = "0.1.0"
description = "AI backlog copilot for Product Engineering & R&D IT product owners"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mission-control-common @ git+https://github.com/aenealabs/mission-control-common.git@v0.3.0",
    "anthropic>=1.15",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.8",
    "sqlmodel>=0.0.22",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "authlib>=1.3",
    "itsdangerous>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
azure = ["azure-identity>=1.17"]
demo = ["playwright>=1.45", "imageio-ffmpeg>=0.5"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backlog_pilot*"]

[tool.setuptools.package-data]
backlog_pilot = ["templates/**/*", "static/**/*", "help/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
